name: Lumen
options:
  bundleIdPrefix: com.lumen.player
  deploymentTarget:
    iOS: "17.0"
targets:
  Lumen:
    type: application
    platform: iOS
    sources: [Lumen]
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumen.player.app
        SWIFT_VERSION: "5.0"
